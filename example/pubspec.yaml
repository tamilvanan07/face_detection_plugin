name: face_detection_plugin_example
description: "Demonstrates how to use the face_detection_plugin plugin with ObjectBox Vector DB."
publish_to: 'none'

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  face_detection_plugin:
    path: ../

  cupertino_icons: ^1.0.8
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  flat_buffers: ^25.9.23
  permission_handler: ^11.3.1
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/blaze_face_short_range.tflite
    - assets/facenet_512.tflite
